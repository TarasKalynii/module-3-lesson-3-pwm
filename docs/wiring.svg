<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">Схема підключення фоторезистора та сервопривода до ESP32-S3</title>
  <desc id="desc">Фоторезистор між 3V3 і GPIO9, резистор 10 кОм між GPIO9 і GND. Сигнал сервопривода від GPIO14. Сервопривід має окреме живлення, земля спільна з ESP32.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #172535; }
    .title { font-size: 29px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #415367; }
    .heading { font-size: 22px; font-weight: 700; }
    .label { font-size: 17px; font-weight: 600; }
    .small { font-size: 15px; fill: #415367; }
    .box { fill: #fff; stroke: #869aae; stroke-width: 2; }
    .wire { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .logic { stroke: #1265a5; }
    .power { stroke: #b73c25; }
    .ground { stroke: #344256; }
  </style>
  <rect width="1000" height="590" rx="18" fill="#f4f8fc"/>
  <text x="35" y="53" class="title">Фоторезистор → ESP32-S3 → сервопривід</text>
  <text x="35" y="82" class="subtitle">Модуль 3 · заняття 38 · дільник напруги та PWM 50 Гц</text>

  <rect x="375" y="145" width="240" height="285" rx="12" class="box"/>
  <text x="495" y="207" text-anchor="middle" class="heading">ESP32-S3</text>
  <text x="391" y="178" class="label">3V3</text>
  <text x="391" y="328" class="label">GPIO9</text>
  <text x="391" y="352" class="small">ADC1_CH8</text>
  <text x="597" y="327" text-anchor="end" class="label">GPIO14</text>
  <text x="597" y="351" text-anchor="end" class="small">PWM</text>
  <text x="495" y="415" text-anchor="middle" class="label">GND</text>

  <path d="M375 180 H150 V236" class="wire power"/>
  <path d="M150 236 V246 L137 255 L163 265 L137 275 L163 285 L137 295 L150 304 V335 H375" class="wire logic"/>
  <path d="M99 238 L126 257 M103 263 L130 282 M117 257 L126 257 L123 249 M121 282 L130 282 L127 274" class="wire logic" style="stroke-width:2"/>
  <text x="179" y="267" class="label">Фоторезистор</text>
  <text x="179" y="290" class="small">LDR</text>
  <circle cx="150" cy="335" r="5" fill="#1265a5"/>
  <path d="M150 335 V389 L137 398 L163 408 L137 418 L163 428 L137 438 L150 447 V500" class="wire ground"/>
  <text x="179" y="424" class="label">10 кОм</text>

  <rect x="750" y="275" width="190" height="155" rx="12" class="box"/>
  <text x="845" y="387" text-anchor="middle" class="heading">Сервопривід</text>
  <text x="766" y="330" class="label">SIG</text>
  <text x="805" y="301" text-anchor="middle" class="label">V+</text>
  <text x="845" y="415" text-anchor="middle" class="label">GND</text>
  <path d="M615 335 H750" class="wire logic"/>

  <rect x="745" y="130" width="195" height="82" rx="10" class="box"/>
  <text x="842" y="158" text-anchor="middle" class="label">Живлення серво</text>
  <text x="842" y="182" text-anchor="middle" class="small">За паспортом моделі</text>
  <text x="805" y="205" text-anchor="middle" class="label">+</text>
  <text x="916" y="205" text-anchor="middle" class="label">−</text>
  <path d="M805 212 V275" class="wire power"/>
  <path d="M916 212 V240 H965 V500 H150 M495 430 V500 M845 430 V500" class="wire ground"/>
  <circle cx="495" cy="500" r="5" fill="#344256"/>
  <circle cx="845" cy="500" r="5" fill="#344256"/>
  <path d="M495 500 V520 M477 520 H513 M483 526 H507 M489 532 H501" class="wire ground"/>
  <text x="495" y="558" text-anchor="middle" class="label">Спільна земля ESP32, дільника та сервопривода</text>
</svg>
